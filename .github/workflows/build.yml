name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build Glance.app
        run: bash build.sh

      - name: Publish download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" build/Glance.zip \
            --title "Glance (build ${{ github.run_number }})" \
            --notes "Download Glance.zip, double-click it, and drag Glance into Applications."
